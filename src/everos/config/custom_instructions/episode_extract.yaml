# Custom instructions for episode extraction (``chat.episode``, every chat cell).
#
# What it does
#   When enabled, ``instructions`` is placed verbatim in the episode prompt.
#   Every cell is sent the original episode request (everalgo-user-memory
#   0.3.1's): the text fills its "Custom instructions" slot, in place of the
#   five default principles that slot holds otherwise. It adds requirements;
#   it cannot change the output shape. The text is never rendered as a
#   template, so braces stay literal.
#
# To use it
#   1. Write the requirement below, e.g.
#        instructions: "Name the product version whenever the conversation mentions one."
#   2. Flip ``enabled`` to ``true``.
#
# Disabled, or with blank ``instructions``, the operator runs on its own rules.

enabled: false
instructions: ""
