# everos default configuration.
#
# Lookup order (later overrides earlier):
#   1. This file (shipped defaults; lowest priority)
#   2. <root>/everos.toml — user config (optional; root resolved by
#      resolve_root(): EVEROS_ROOT env > ~/.everos)
#   3. Environment variables — EVEROS_<SECTION>__<KEY>
#         e.g. EVEROS_SQLITE__BUSY_TIMEOUT_MS=10000
#   4. Programmatic init args (highest priority)
#
# `null` (omitted in TOML) means "use the Pydantic default declared in code".

[memory]
# Effective timezone for date buckets and timestamps. Drives
# core.utils.datetime; this is the SOLE source — OS `TZ` is not
# read. Override via `EVEROS_MEMORY__TIMEZONE` env var if needed.
timezone = "UTC"

[api]
# HTTP server bind for ``everos server start``. Default ``127.0.0.1``
# keeps the API on loopback only — EverOS ships no built-in auth (see
# SECURITY.md threat model). Only set ``host = "0.0.0.0"`` after you
# have placed your own gateway / auth layer in front of the server.
# Override via EVEROS_API__HOST and EVEROS_API__PORT.
host = "127.0.0.1"
port = 8000

[sqlite]
# PRAGMA journal_mode  — WAL is the recommended high-concurrency mode.
journal_mode = "WAL"
# PRAGMA synchronous  — NORMAL is safe under WAL and ~2x faster than FULL.
synchronous = "NORMAL"
# PRAGMA foreign_keys — must be explicitly enabled per connection.
foreign_keys = true
# PRAGMA temp_store   — MEMORY keeps query intermediates in RAM (no IO impact
# on durability — only affects sort/group/temp-table calculation buffers).
temp_store = "MEMORY"
# PRAGMA busy_timeout — milliseconds to wait on a locked DB before erroring.
busy_timeout_ms = 5000
# PRAGMA journal_size_limit — cap WAL/journal at ~64 MB.
journal_size_limit_bytes = 67108864
# PRAGMA cache_size  — KB of page cache (per connection).
cache_size_kb = 2048

[lancedb]
# Read consistency interval in seconds.
#   omitted / null -> no consistency check (fastest reads)
#   0              -> strict (every read checks updates)
#   >0             -> eventual (interval seconds between checks)
# Uncomment to override:
# read_consistency_seconds = 5.0
# Rows (with a non-null vector) before a table's vector columns get an
# IVF_FLAT index. Below it every vector query scans the whole column.
# vector_index_min_rows = 2000
# Search queries one process runs on LanceDB at once; the rest wait.
# max_concurrent_queries = 32

[index]
# Rebuildable vector/BM25 index. Markdown remains the source of truth.
backend = "lancedb"

[milvus]
# Remote Milvus Server or Zilliz Cloud only; Milvus Lite paths are unsupported.
uri = ""
token = ""
db_name = ""
consistency_level = "Session"
collection_prefix = "everos"

[llm]
# Provider-agnostic OpenAI-protocol client config. Override via env:
#   EVEROS_LLM__MODEL, EVEROS_LLM__API_KEY, EVEROS_LLM__BASE_URL
# Or set the field directly in this file (<root>/everos.toml).
model = "openai/gpt-4.1-mini"
api_key = ""
base_url = "https://openrouter.ai/api/v1"
# How the reply format is requested: "json_schema" (strict schema, default),
# "json_object" (JSON mode) or "prompt_only" (prompt alone). Not every endpoint
# accepts a strict schema -- on OpenRouter, sending one can reroute the request.
# response_format_mode = "json_schema"
# Extra attempts after a reply that fails validation (sampled at retry_temperature).
# invalid_reply_retries = 1
# Sampling temperature of every extraction call; 0.0 keeps runs repeatable. "none"
# leaves the field out, for an endpoint that rejects it (EVEROS_LLM__TEMPERATURE=none).
temperature = 0.0
# Temperature of a retry after an unusable reply, so the retry does not reproduce
# the same reply; used only when above the first attempt's temperature.
retry_temperature = 0.3
# Deadline of one request in seconds. Raise it for slow self-hosted endpoints;
# one extraction call may take up to (invalid_reply_retries + 1) x this.
# timeout_seconds = 60.0

# LLM for the multi-round retrieval decider. Separate from [llm] because the jobs
# differ: [llm] extracts memories during ingestion, this one decides -- inside the search
# request, round by round -- which episodes are core and what to query next. An empty
# model falls back to [llm], which is how every store built before this section existed
# was scored. api_key / base_url are also inherited from [llm] when left blank, so
# pointing the decider at another hosted model needs only `model`; set base_url to run it
# on a local vLLM / SGLang endpoint instead.
[decider]
# LLM for the multi-round retrieval decider, when it differs from [llm]. Left
# empty the decider runs [llm]'s model, which is what a single-model deployment
# wants. Override via env: EVEROS_DECIDER__MODEL / __API_KEY / __BASE_URL /
# __TIMEOUT_SECONDS / __EXTRA.
#
# ⚠ model and base_url must move together. Renaming the model while leaving the
# endpoint pointed at a server that does not host it returns 404 on every call,
# and the retrieval loop does NOT fail on that -- it falls back to a fixed
# top-ranked core and reports a complete result. See the fallback note in
# everos.memory.search.llm_multiround.
model = ""
api_key = ""
base_url = ""
# The decider asks for its JSON in the prompt only and reads the reply
# tolerantly, as the decider policy was trained and evaluated; it does not
# inherit [llm]'s mode. json_object / json_schema are opt-ins for an endpoint
# that needs one (json_schema makes vLLM grammar-constrain every reply).
response_format_mode = "prompt_only"
# Sampling temperature of every decider call; the decider policy was trained and
# evaluated at 0.0. Unset, a vLLM endpoint falls back to the model's
# generation_config (Qwen3.8-27B: 1.0) and searches stop being repeatable.
temperature = 0.0

# Multi-round loop tuning. Every one of these is a real field, so `everos config`
# prints it and a TOML can set it; the legacy EVEROS_LLMMR_* env names still take
# precedence when exported, so launch scripts keep working unchanged.
max_rounds = 3                 # rounds before the loop stops regardless
seed_topk = 50                 # candidates the original question contributes
subq_topk = 20                 # candidates each follow-up sub-query contributes
max_subqueries = 3             # follow-ups the decider may ask for per round
rrf_k = 60                     # RRF smoothing when fusing sparse + dense
no_new_core_patience = 1       # stop after this many rounds add no new core
per_subquery_guarantee = 1     # slots reserved per sub-query in the final fill
retries = 3                    # decider retries before falling back
retry_backoff_seconds = 0.5    # doubled per attempt
core_overflow = false          # true = let core exceed top_k (pre-2026-08-06)
# Order of the core at the front of the result, which with more core than top_k
# also decides which core items are kept: "score" = best RRF score over the
# sub-queries; "round" = the round the decider kept the item in, earlier first,
# then that score. "round" ranks better on open-domain QA but answered
# EverMemBench worse (2026-11-13), so "score" stays the default.
core_order = "score"
fallback_core = 3              # core size when every decider attempt fails
fit_to_window = true           # re-render a prompt rejected as too long
salvage_truncated_core = true  # keep the core of a reply cut after it
image_candidates_per_round = 0 # pictures the decider may look at per round; 0 = none
image_detail = "low"           # `detail` hint on each picture part
image_thumbnail_edge = 448     # long side of the decider's copy, in pixels
image_quality = 85             # JPEG quality of the decider's copy

[multimodal]
# Independent LLM for multimodal parsing (everalgo-parser); must accept
# image / pdf / audio image_url parts. Override via env:
#   EVEROS_MULTIMODAL__MODEL, EVEROS_MULTIMODAL__API_KEY, EVEROS_MULTIMODAL__BASE_URL
model = "google/gemini-3.8-flash"
api_key = ""
base_url = "https://openrouter.ai/api/v1"
max_concurrency = 4
# See [llm].
# response_format_mode = "json_schema"
# invalid_reply_retries = 1
# file:// content-item support (read locally by EverOS, not everalgo).
# file_uri_allow_dirs: empty = allow any readable file (local-first default);
# list base dirs to confine reads when the API is exposed.
# file_uri_allow_dirs = ["/srv/uploads"]
# file_uri_max_bytes = 52428800   # 50 MiB cap per file:// asset

[images]
# Picture content items: how they are stored and how big the two derived copies
# are. Pictures are content-addressed and stored once, so these bound INGRESS,
# not the store: the same picture arriving twice costs one file and one more
# reference. Override via EVEROS_IMAGES__<KEY>.
max_bytes = 10485760        # 10 MiB per picture, after the content item decodes
max_per_message = 4         # pictures one message may carry; the rest are reported rejected
max_request_bytes = 33554432  # 32 MiB of pictures per add request
max_per_request = 16        # pictures per add request
thumbnail_edge = 448        # long side of the decider's copy (patches 16, 2x2 merge: ~200 tokens)
model_edge = 1024           # long side of the copy the extraction / answer model sees
cache_quality = 85          # JPEG quality of both derived copies
formats = ["png", "jpeg", "webp", "gif"]

[extraction]
# Whether the model behind [llm] reads images. On: pictures go to it directly
# and it writes each picture's memory itself. Off: [multimodal] parses them into
# text first (one extra call per picture) -- for a text-only extraction model.
# Override via EVEROS_EXTRACTION__VISION.
vision = true

[embedding]
# OpenAI-compatible embedding endpoint. Override via env:
#   EVEROS_EMBEDDING__MODEL, EVEROS_EMBEDDING__API_KEY, EVEROS_EMBEDDING__BASE_URL
# model and base_url ship with recommended defaults; api_key must be set.
model     = "Qwen/Qwen3-Embedding-4B"
api_key   = ""
base_url  = "https://api.deepinfra.com/v1/openai"
# Width of the vector column in every index table. The model must return at
# least this many dimensions; a longer vector is truncated (only lossless for
# Matryoshka models), a shorter one is refused at startup. Changing it means
# every stored vector is invalid: run `everos cascade rebuild`.
dim       = 1024
timeout_seconds = 30.0
max_retries     = 3
batch_size      = 10
max_concurrent  = 10
# Reserved budget for interactive query embeds, so a search is not queued
# behind the cascade's background writes (issue #473). Searches per second
# the endpoint can serve is about this value / per-call latency.
query_max_concurrent = 16

[vision_embedding]
# The picture's own embedding endpoint -- an OpenAI-protocol /embeddings that
# accepts chat-style input (a picture travels as an image_url content part, so
# a plain text embedding endpoint cannot fill this role) and applies the
# model's own input recipe. Stock vLLM 0.32's chat-embedding path does NOT:
# it drops the prompt's last token and returns wrong vectors for
# Qwen3-VL-Embedding-*. Check a server against the model card's reference
# similarities before using it.
#
# Left empty, picture memories carry only their description's text vector and
# the visual route is skipped -- the deployment still works, it just cannot
# recall a picture by what it looks like.
# Override via env: EVEROS_VISION_EMBEDDING__MODEL / __API_KEY / __BASE_URL / __DIM
model     = ""
api_key   = ""
base_url  = ""
# Width of the `visual_vector` column. Native widths: Qwen3-VL-Embedding-8B
# 4096, WeMM-Embedding-4B 2560, Qwen3-VL-Embedding-2B 2048. A longer vector is
# cut to this width, lossless only for Matryoshka models. Changing it
# invalidates every stored visual vector (`everos cascade rebuild`).
dim       = 4096
timeout_seconds = 60.0
max_retries     = 3
batch_size      = 8
max_concurrent  = 4
query_max_concurrent = 16

[boundary_detection]
# Passed through to ``everalgo.boundary.adetect_boundaries``: leading cells
# are cut without the model until the rest fits under both limits.
hard_token_limit = 65536
hard_msg_limit = 500

[memorize]
# Maximum wall-clock for one add() / flush() invocation while holding the
# per-session lock. On timeout the outer asyncio.timeout cancels the call
# and the lock auto-releases so subsequent concurrent /add on the same
# session aren't deadlocked. Covers boundary LLM + memcell writes +
# synchronous portion of pipeline dispatch.
# Override via EVEROS_MEMORIZE__SESSION_LOCK_TIMEOUT_SECONDS.
session_lock_timeout_seconds = 360.0
# How long a forget of a conversation (POST /memory/forget with a session
# target, /forget/session, POST /memory/delete with a session_id, a group
# forget) waits for an add() in progress on that session; past it the forget
# returns 503 SESSION_BUSY and forgets nothing. 2.0 has no hard delete.
delete_wait_seconds = 10.0

[memorize.async_queue]
# Queue behind ``async_mode=true`` on /add (a /flush joins it only behind its
# session's backlog). Off -> such requests run synchronously; rows accepted
# while it was on are still delivered.
enabled = true
# Batches delivered at once, never two from one session: a session's batches
# run in arrival order, sessions run side by side. 1 serialises everything.
max_concurrency = 4
# Unfinished rows per session; beyond this /add and /flush answer 429.
max_pending_per_session = 50
# Unfinished rows across all sessions; beyond this the answer is 429.
max_pending_total = 200
# One request body (serialised); beyond this the answer is 413.
max_payload_bytes = 4194304
# Fallback sweep interval. Enqueue wakes the worker immediately.
scan_interval_seconds = 5.0
# Delivery attempts per row before it is marked failed and skipped. Keep 1
# unless duplicate memcells after a partial failure are acceptable: the
# memorize pipeline is not atomic, so a re-run is not a clean retry.
max_attempts = 1
retry_backoff_seconds = 2.0
# A row in flight when the process died is replayed on the next start; after
# this many replays without finishing it is marked failed (poison-pill guard).
max_replays = 3
# Rows (any status) are deleted this many hours after they were created.
row_retention_hours = 168.0

[clustering]
# Scene clustering geometry: cosine similarity threshold and time window.
# Episodes older than ``time_window_days`` from the newest cluster
# member are excluded from merge consideration.
# Override via EVEROS_CLUSTERING__THRESHOLD, EVEROS_CLUSTERING__TIME_WINDOW_DAYS.
threshold = 0.65
time_window_days = 7.0

[scenes]
# An owner's scenes: its episodes about one matter -- close in vector and in
# time, the [clustering] geometry -- with one narrative over them, ending on
# where things stand. Scenes compete with episodes in the same search pool.
# One capped narrative call each time an episode joins a scene of min_members
# episodes or more; an episode that joins none costs none. Users and groups
# build them the same way, each under its own switch, both off by default
# until their cost is accepted. Override via EVEROS_SCENES__USERS,
# EVEROS_SCENES__GROUPS.
# Every user's scenes (users/<u>/scenes/).
users = false
# Every group's scenes (groups/<g>/scenes/, docs/group-memory.md section 7.7).
groups = false
min_members = 2
# The narrative's cap: the prompt asks for at most this many words and a reply
# past it is clipped, so the narrative and the next call's prompt stay bounded.
narrative_max_words = 300
# One call reads at most this many joining episodes (the newest), each clipped.
max_new_episodes = 4
episode_max_chars = 4000


[cascade]
# Run the cascade (watcher + scanner + worker) that projects md into the index.
# Off -> md edits never become searchable; only for runs that never search or
# that drive `everos cascade sync` themselves.
enabled = true
# Run the filesystem watcher. Off -> the scanner alone picks up md edits, one
# scan_interval_seconds later. Use it on a host whose inotify watch limit is
# exhausted (the server would otherwise die at startup with Errno 28); unlike
# enabled = false, md still reaches the index.
# EVEROS_DISABLE_CASCADE=1 / EVEROS_DISABLE_CASCADE_WATCHER=1 (the evaluation
# harness's switches) turn these two off as well.
watcher_enabled = true
# Maintenance cadences (seconds). Deadlines that bound a hung call are not
# here on purpose — they live next to the code they guard and are sized from
# measurement, not preference.
optimize_heartbeat_seconds = 60.0
optimize_prune_interval_seconds = 300.0
# Passed to LanceDB as cleanup_older_than. Only has to outlive an in-flight
# read, but it also decides how long index files keep a manifest naming them:
# under LanceDB's 7-day unverified window they then wait out the full 7 days.
optimize_prune_retention_seconds = 60.0
optimize_rebuild_interval_seconds = 43200.0
# How often the scanner walks the memory root for changes the watcher missed.
# On a mount that delivers no filesystem events (a Windows directory bound into
# WSL2 or a container) this is the edit-to-searchable latency. Every sweep also
# stats every md file, which over a slow mount is the cost of a short interval.
scan_interval_seconds = 30.0
# A memory deletion fences the index rows it removed until the cascade runs
# that started before it end; above this many entries it logs
# memory_delete_fence_large (some run is not ending).
delete_fence_warn_entries = 100000

[ome]
# Offline memory engine tunables. Not to be confused with <memory-root>/ome.toml,
# which overrides individual strategies (enabled / gate / cron).
# Start the engine. Off only for a server that searches a store built elsewhere:
# no strategy runs, and a memorize there fails at its event publish. The root
# lock is still taken. EVEROS_DISABLE_OME=1 turns it off as well.
enabled = true
# Engine-wide cap on concurrent strategy runs. Each slot mostly waits on a
# remote extraction call, so a bulk ingest can afford far more than this.
max_concurrent_runs = 20
# Wall-clock ceiling (seconds) on one strategy attempt: a deadlock backstop,
# not a latency target -- too low kills slow-but-healthy extractions. 0 disables.
run_timeout_seconds = 1800.0

[groups]
# Group memory (docs/group-memory.md, section 5.2).
# An /add naming an unknown group_id creates the group.
implicit_create = true
# A message from a sender who is not a member opens an interval at that
# message (source = implicit); false refuses such a batch with 422.
implicit_join = true
# A member's profile in a group is updated after this many new segments in
# which they spoke, and at every flush of the group (section 7.4).
member_profile_every = 5
# A group search's multi-round question names the asker:
# "<display name>: <question>" (section 8.2).
asker_in_question = true
# The group profile (section 7.5): topics, decisions, dissent and roles,
# append-only, updated by one model call per batch of segments -- after
# group_profile_batch new segments, after group_profile_idle_seconds without
# one, and at every flush of the group. false keeps no group profile.
group_profile = true
group_profile_batch = 5
group_profile_idle_seconds = 600

[search]
# What a group search adds around its ranking (docs/group-memory.md, 8.3-8.5).
# After each multi-round round, follow the stored links of the new core
# (decision chains, shared topics, subjects, a scene's episodes) and show at
# most link_slots linked records in the next round.
expansion = true
link_slots = 5
# The constraint block: "rules" (verified group-profile items and the core's
# metadata) or "model" (adds one call stating applicability and scope).
constraints = "rules"
# Current group-profile items attached per kind to a group search.
group_profile_cap = 20
# The forgetting curve (docs/configuration.md, [search]); off by default. On,
# each candidate's fused score is multiplied by
# 1 - retention_weight + retention_weight * R, with R = 1 / (1 + days / (9 * S)):
# days since the memory was last used, S its strength in days. S starts at
# initial_strength_days; each time the decider keeps the memory as core, or
# get returns it, S grows by 1 + reinforce_gain * (1 - R), up to
# max_strength_days. No model call; a read-only server
# ([cascade] enabled = false) never reinforces.
forgetting_curve = false
initial_strength_days = 30.0
max_strength_days = 3650.0
reinforce_gain = 2.0
retention_weight = 0.3
reinforce = true
# A search with include_past also ranks superseded versions and forgotten
# memories (inside groups, never a forgotten one); their score is multiplied
# by this.
past_state_factor = 0.3
# Asking about the past by its wording (docs/configuration.md, [search]); off
# by default. On, a search that does not set include_past runs as if it did
# when its question (as asked, never a decider's sub-query) holds past-time
# wording: a match of past_trigger_words_en (case-insensitive, whole words)
# or past_trigger_words_zh (anywhere) that no match of that language's
# past_trigger_exceptions_* covers, or, with past_trigger_dates, a year,
# month or day that ended before the day it is asked. The response names the
# trigger (past_trigger). An include_past the request sets always wins. No
# model call.
past_triggers = false
past_trigger_dates = true
# The four lists hold regular expressions. Unset (as here), they are the
# built-in lists, everos/config/past_triggers_en.toml and past_triggers_zh.toml
# in the installed package; a list set here replaces its built-in one, and []
# switches it off:
# past_trigger_words_en = ['used to', 'back then']
# past_trigger_exceptions_en = []
# past_trigger_words_zh = []
# past_trigger_exceptions_zh = []

[access]
# Gateway identity header (docs/group-memory.md, section 9.2). EverOS has no
# authentication: the asker of a request is the caller's assertion. A
# deployment serving several people sets the header its gateway writes; the
# asker is then read from it, and a body asker_id that differs is refused
# with 403. Unset (default): the body's asker_id is the asker.
# identity_header = "X-EverOS-Asker"

[logging]
# Console log level: DEBUG | INFO | WARNING | ERROR. `everos server start
# --log-level` (or EVEROS_LOG_LEVEL) overrides it for the server; interactive
# commands (cascade / init / config / demo) log WARNING, INFO with --verbose.
level = "INFO"
# Where the lines go: "stdout" or "stderr". `everos memory` always logs to
# stderr: its standard output is its JSON answer.
stream = "stdout"

[observability]
# OpenTelemetry tracing export. Off by default; pure OTLP/HTTP, vendor-neutral
# (Langfuse, an OTel Collector, or any OTLP backend). EverOS ships no vendor SDK.
# Override via EVEROS_OBSERVABILITY__ENABLED, EVEROS_OBSERVABILITY__ENDPOINT, etc.
enabled = false
exporter = "otlp_http"          # "otlp_http" | "none"
endpoint = ""                    # e.g. https://us.cloud.langfuse.com/api/public/otel/v1/traces
service_name = "everos"
sample_rate = 1.0                # 0.0 to 1.0
# Privacy: false (default) = metadata only; true also emits query / extracted
# memory / .md paths as span input/output (redacted + truncated).
capture_content = false
# Recall-quality scores pushed to Langfuse (Langfuse-specific REST, off the
# OTLP stream). Only fires when langfuse_public_key/secret_key/host are set
# (via everos.toml or EVEROS_OBSERVABILITY__LANGFUSE_* — secrets, not shipped here).
# Score name: "recall_top_score_raw" -- the multi-round top score is the max
# RRF score across sub-queries, not a calibrated [0, 1] relevance, so no
# "recall_hit" verdict is pushed.
emit_recall_scores = true
