version: 2

updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Python dependencies (pip/uv) at the project root
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
    # These are pinned on purpose and upgraded by hand, together with the code
    # changes the new version needs; a grouped bump of them has failed the test
    # suite every time (#470, #523, #543, #559, #562). everalgo is pinned
    # exactly and moves only with the code for its contract: even a
    # pre-release step inside one minor (0.5.0rc3 -> rc4, #562) broke the
    # suite, so every everalgo update is skipped. lancedb is 0.x, where a
    # minor release is the breaking one, so its minor bumps are skipped as
    # well; its patch releases and openai's minor ones still come through.
    ignore:
      - dependency-name: "everalgo-*"
      - dependency-name: "lancedb"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]
