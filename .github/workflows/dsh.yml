name: DSH plugin

on:
  push:
    branches: [main]
    paths:
      - "examples/dsh/**"
      - ".github/workflows/dsh.yml"
  pull_request:
    paths:
      - "examples/dsh/**"
      - ".github/workflows/dsh.yml"
  workflow_dispatch:

concurrency:
  group: dsh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint, test, build, and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/dsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: examples/dsh/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint, typecheck, test, and build
        run: npm run ci

      - name: Verify npm package contents
        run: npm pack --dry-run
